# CMS Reverse Proxy for HexaVeil
# HTTP — redirect + ACME challenge
server {
    listen 85.198.99.102:80;
    server_name test.hexaveil.xyz hexaveil.xyz www.hexaveil.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 85.198.99.102:443 ssl http2;
    server_name test.hexaveil.xyz hexaveil.xyz www.hexaveil.xyz;

    ssl_certificate /etc/nginx/ssl/fullchain_cms.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey_cms.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cms_ssl:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 64M;
}