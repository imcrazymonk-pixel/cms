# Production Docker Compose for HexaVeil CMS (standalone server)
# Используется на отдельном сервере, без reverse proxy.
# Nginx сам слушает 80-й порт.
#
# Установка:
#   cp docker-compose.prod.yml /opt/HexaVeil_CMS/docker-compose.yml
#   cp .env.prod /opt/HexaVeil_CMS/.env
#   cd /opt/HexaVeil_CMS && docker compose up -d

services:
  app:
    build: .
    container_name: hexacms_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Только uploads сохраняются, код read-only из образа
      - uploads_data:/var/www/html/public/uploads
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    image: nginx:alpine
    container_name: hexacms_web
    restart: unless-stopped
    ports:
      # CMS будет доступна только на этом IP.
      # CMS_BIND_IP по умолчанию 127.0.0.1 (за host-nginx/Caddy); для прямого
      # доступа снаружи задать в .env, например CMS_BIND_IP=85.198.99.102.
      # CMS_HTTP_PORT по умолчанию 3000 (совместимо с текущим продом).
      - "${CMS_BIND_IP:-127.0.0.1}:${CMS_HTTP_PORT:-3000}:80"
      # Для HTTPS раскомментировать:
      # - "${CMS_BIND_IP:-127.0.0.1}:443:443"
    volumes:
      # Конфиг nginx
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Код — read-only, чтобы случайно не поправить
      - .:/var/www/html:ro
      # Uploads — read-write для загрузки картинок
      - uploads_data:/var/www/html/public/uploads
      # Для HTTPS раскомментировать:
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_started
      api:
        condition: service_started
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── FastAPI backend (Phase 2) ──
  api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: hexacms_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Uploads — общий том с app/web (media list/upload)
      - uploads_data:/var/www/html/public/uploads
      # Локальное хранилище бэкапов (inline-бэкап CMS)
      - backup_data:/var/lib/hexaveil/backups
      # Корень проекта — для diagnostics (nodes_stats.json + tools/collect_stats.py)
      - .:/var/www/html
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: hexacms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cms}
      POSTGRES_USER: ${DB_USER:-cms}
      POSTGRES_PASSWORD: ${DB_PASS:-cms_secret_2026}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    # Тихие служебные логи (checkpoint и т.п.) — только WARNING и выше.
    command: ["postgres", "-c", "log_min_messages=warning"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Схему и миграции применяет сервис `migrate` (единый источник истины),
      # поэтому initdb-каталог здесь больше не монтируется.
    expose:
      - "5432"
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cms} -d ${DB_NAME:-cms}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── One-shot bootstrap + migrations (ledger: schema_migrations) ──
  # Applies db/postgres/init/01-schema.sql on an empty database, then every
  # file migration not yet in the ledger. `app` and `api` wait for exit 0.
  migrate:
    image: postgres:16-alpine
    container_name: hexacms_migrate
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
      - ./deploy/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    networks:
      - cms-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  backup_data:
    driver: local

networks:
  cms-network:
    driver: bridge