# Production Docker Compose for HexaVeil CMS (standalone server)
# Используется на отдельном сервере, без reverse proxy.
# Nginx сам слушает 80-й порт.
#
# Установка:
#   cp docker-compose.prod.yml /opt/HexaVeil_CMS/docker-compose.yml
#   cp .env.prod /opt/HexaVeil_CMS/.env
#   cd /opt/HexaVeil_CMS && docker compose up -d

services:
  app:
    build: .
    container_name: hexacms_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Только uploads сохраняются, код read-only из образа
      - uploads_data:/var/www/html/public/uploads
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    image: nginx:alpine
    container_name: hexacms_web
    restart: unless-stopped
    ports:
      # CMS будет доступна только на этом IP
      # В .env указать CMS_BIND_IP=твой.новый.ip
      - "${CMS_BIND_IP}:80:80"
      # Для HTTPS раскомментировать:
      # - "${CMS_BIND_IP}:443:443"
    volumes:
      # Конфиг nginx
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Код — read-only, чтобы случайно не поправить
      - .:/var/www/html:ro
      # Uploads — read-write для загрузки картинок
      - uploads_data:/var/www/html/public/uploads
      # Для HTTPS раскомментировать:
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_started
      api:
        condition: service_started
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── FastAPI backend (Phase 2) ──
  api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: hexacms_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploads — общий том с app/web (media list/upload)
      - uploads_data:/var/www/html/public/uploads
      # Корень проекта — для diagnostics (nodes_stats.json + tools/collect_stats.py)
      - .:/var/www/html
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: hexacms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cms}
      POSTGRES_USER: ${DB_USER:-cms}
      POSTGRES_PASSWORD: ${DB_PASS:-cms_secret_2026}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Авто-инициализация схемы при первом запуске
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cms} -d ${DB_NAME:-cms}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  cms-network:
    driver: bridge