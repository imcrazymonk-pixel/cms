services:
  app:
    build: .
    container_name: hexacms_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/public/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cms-network

  api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: hexacms_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./web/backend:/app/web/backend
      - .:/var/www/html
      - uploads_data:/var/www/html/public/uploads
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    image: nginx:alpine
    container_name: hexacms_web
    restart: unless-stopped
    # Хостовый порт настраивается через CMS_HTTP_PORT (по умолчанию 80).
    # На сервере с selfsteal (занят :80) задать CMS_HTTP_PORT=3000 в .env.
    ports:
      - "${CMS_HTTP_PORT:-80}:80"
    volumes:
      # Каталог целиком (а не один файл) — чтобы правки default.conf были видны
      # без пересоздания контейнера (иначе bind-mount одного файла держит старый inode).
      - ./.docker/nginx:/etc/nginx/conf.d:ro
      - .:/var/www/html
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      - app
      - api
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: hexacms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cms}
      POSTGRES_USER: ${DB_USER:-cms}
      POSTGRES_PASSWORD: ${DB_PASS:-cms_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d
      - ./db/postgres/migrations:/migrations
    # Наружу БД не публикуем (только локально, для отладки).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cms} -d ${DB_NAME:-cms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cms-network

volumes:
  pgdata:
  uploads_data:

networks:
  cms-network:
    driver: bridge
