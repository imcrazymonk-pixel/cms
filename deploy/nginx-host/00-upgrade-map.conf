# ── Fallback host-nginx: WebSocket upgrade map ─────────────────────────────
# `map` is only valid in the http context, so this file must be included from
# http { } — simplest: drop it into /etc/nginx/conf.d/ (which nginx includes
# inside http) and reload. The site/admin server blocks rely on it for
# `proxy_set_header Connection $connection_upgrade;`.
#
#   sudo cp deploy/nginx-host/00-upgrade-map.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
