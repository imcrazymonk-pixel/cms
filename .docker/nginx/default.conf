server {
    listen 80;
    server_name localhost hexacms;
    root /var/www/html;
    index index.php;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    client_max_body_size 64M;

    # React SPA (cms-admin build)
    location = /cms-admin {
        return 302 /cms-admin/;
    }

    location ^~ /cms-admin/ {
        alias /var/www/html/cms-admin/dist/;
        index index.html;
        try_files $uri $uri/ /cms-admin/index.html;

        location ~* \.(css|js|svg|woff|woff2|ttf|eot|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 64M \n post_max_size = 64M";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(config|core|db|templates|install|\.docker|docker-entrypoint\.sh|Dockerfile|docker-compose\.yml|\.env) {
        deny all;
    }
}