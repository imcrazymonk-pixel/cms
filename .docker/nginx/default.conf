# Компактный access-log: без User-Agent / Referer (они раздувают строки и
# мешают читать). Метода, пути, статуса и времени достаточно.
log_format hexa '$remote_addr "$request" $status ${request_time}s';

# Не логируем статику, health-чек и ACME-пробы — это ~80% шума.
map $uri $hexa_loggable {
    default 1;
    ~^/admin/assets/ 0;
    ~^/api/health 0;
    ~^/.well-known/ 0;
    ~*\.(css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ 0;
}

server {
    listen 80;
    server_name localhost hexacms;
    root /var/www/html;
    index index.php;

    access_log /var/log/nginx/access.log hexa if=$hexa_loggable;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    client_max_body_size 64M;

    # ── FastAPI backend (Phase 2 migration) ──
    # Migrated PHP-bridge endpoints now proxy to FastAPI (React keeps same paths).
    location ^~ /admin/diagnostics/api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /admin/settings/save-all-preferences {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /admin/settings/save-preference {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Finance (core + Platega/YooKassa payments) all on FastAPI
    location ^~ /admin/finance/api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Legacy PHP admin is fully disabled — SPA handles /admin/* and FastAPI the JSON API.
    # /admin/logout kept as a client-friendly redirect (SPA clears the JWT itself).
    location = /admin/logout {
        return 302 /admin/login;
    }

    # FastAPI — все /api/* эндпоинты, которые уже переведены
    # (PHP-версии остаются, но nginx выбирает первое совпадение)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /admin {
        return 302 /admin/;
    }

    location ^~ /admin/ {
        alias /var/www/html/web/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 64M \n post_max_size = 64M";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(config|core|db|templates|install|\.docker|docker-entrypoint\.sh|Dockerfile|docker-compose\.yml|\.env) {
        deny all;
    }
}